# Posts CI's results on the pull request as a single comment, updated on every push.
#
# CI (ci.yml) builds fork code with a read-only token, so it can't comment itself. It
# uploads the gate's results as the `ci-result` artifact; this workflow runs after it
# in the base repository's context, where the token may write PR comments.
#
# It never checks out or runs pull request code: the renderer comes from master and
# treats the artifact as untrusted data, and the PR number comes from the triggering
# run's head branch and commit, not from the artifact.
#
# It also measures source quality (tools/source_quality.py and tools/misowned.py, from master) on the pull
# request's merge commit, fetched into a bare repository and read as text only. The
# result is advisory: it is shown in the comment and never fails the pull request.
#
# workflow_run only fires for workflow files on the default branch, so changes to this
# file take effect once they are merged.

name: CI comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/ci_comment.py
            tools/source_quality.py
            tools/misowned.py
          sparse-checkout-cone-mode: false

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-result
          path: ci-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Find the pull request
        id: pr
        run: |
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
                 --jq "[.[] | select(.head.sha == \"$HEAD_SHA\")][0].number // empty")
          if [ -z "$pr" ]; then
            echo "No open pull request has head $HEAD_OWNER:$HEAD_BRANCH at $HEAD_SHA; a newer push supersedes this run."
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      # The merge commit GitHub tested (refs/pull/N/merge) against its first parent, the
      # base branch it merged into. Skipped when the ref has moved on to a newer push or
      # does not exist (a pull request that does not merge cleanly).
      - name: Measure source quality
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          git init -q --bare pr.git
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git --git-dir pr.git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch -q --depth=2 --no-tags "https://github.com/$REPO" "+refs/pull/$PR/merge:refs/pr/merge"
          if [ "$(git --git-dir pr.git rev-parse refs/pr/merge^2)" != "$HEAD_SHA" ]; then
            echo "refs/pull/$PR/merge is not a merge of $HEAD_SHA (a newer push moved it); not measured."
            exit 0
          fi
          python3 tools/source_quality.py --git-dir pr.git --base 'refs/pr/merge^1' --head refs/pr/merge \
            --limit 1000 --json quality.json

      - name: Post or update the comment
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          python3 tools/ci_comment.py ci-result/result.json --sha "$HEAD_SHA" --run-url "$RUN_URL" \
            --quality quality.json > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                 --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pso-ci -->"))) | .id' \
               | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
